name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StarWarsDatapad.slnx
      - run: dotnet build StarWarsDatapad.slnx --no-restore -c Release
      - run: dotnet test --solution StarWarsDatapad.slnx --no-build -c Release
